spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: my-db
    password: my-db
    embedded-directory: build
    jpa:
      spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
payload:
  json:
    max-size-excel: 100
    max-size-pdf: 60
dbMigration:
  runOnStartup: true

